[pytest]
testpaths = experiment-1-debugging experiment-2-observability experiment-3-concurrency experiment-4-incident-analysis
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
markers =
    property: Property-based tests using Hypothesis
    unit: Unit tests for specific examples
    integration: Integration tests across modules
